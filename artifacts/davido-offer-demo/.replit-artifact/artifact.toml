kind = "web"
previewPath = "/"
title = "Davido Offer Demo"
description = "A polished, safe demo of a celebratory data-offer landing page with state selection, network selection, local progress states, and an interactive community comment feed."
version = "1.0.0"
id = "artifacts/davido-offer-demo"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20424

[services.development]
run = "pnpm --filter @workspace/davido-offer-demo run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/davido-offer-demo", "run", "build" ]
serve = "static"
publicDir = "artifacts/davido-offer-demo/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20424"
BASE_PATH = "/"
